<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Campus Collaboration Hub - Member 03 HTTP REST architecture</title>
  <desc id="desc">The console client and curl or browser send HTTP GET /messages to HistoryServer on port 8080. HistoryServer reads MessageStore using toJsonArray. ChatServer will write to MessageStore in the future. All components are intended to share one JVM.</desc>

  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>

  <text x="60" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Campus Collaboration Hub — HTTP/REST Module</text>
  <text x="60" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b5563">Member 03 integration view — branch: feature/http-history</text>

  <!-- Legend -->
  <line x1="60" y1="108" x2="100" y2="108" stroke="#059669" stroke-width="3"/>
  <text x="110" y="113" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">implemented and tested</text>
  <line x1="60" y1="132" x2="100" y2="132" stroke="#9ca3af" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="110" y="137" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">planned / not on this branch</text>
  <rect x="60" y="150" width="14" height="14" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="84" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">shared common store</text>

  <!-- Console client -->
  <rect x="60" y="240" width="250" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">Console Client</text>
  <text x="80" y="297" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">Member 1 — ConsoleClient</text>
  <text x="80" y="323" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1e3a8a">HistoryClient (Member 3)</text>
  <text x="80" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">implemented; /history wiring pending</text>
  <text x="80" y="369" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">other protocols: Members 1/2/4/5</text>

  <!-- curl / browser -->
  <rect x="60" y="430" width="250" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="462" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">curl / browser</text>
  <text x="80" y="488" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1e3a8a">GET /messages</text>
  <text x="80" y="509" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">manual demonstration client</text>

  <!-- HistoryServer -->
  <rect x="440" y="230" width="320" height="220" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="465" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#065f46">HistoryServer</text>
  <text x="465" y="297" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#374151">Member 3 — HTTP :8080</text>
  <text x="465" y="324" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">HttpServer + 8-thread executor</text>
  <text x="465" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">GET /messages</text>
  <text x="465" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">200 / 404 / 405 / 500</text>
  <text x="465" y="398" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#047857">implemented and tested</text>
  <text x="465" y="421" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">binds localhost; UTF-8 JSON responses</text>

  <!-- MessageStore -->
  <rect x="900" y="255" width="240" height="170" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <text x="922" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#92400e">MessageStore</text>
  <text x="922" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">common/ — singleton</text>
  <text x="922" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">CopyOnWriteArrayList</text>
  <text x="922" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">toJsonArray()</text>
  <text x="922" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">read-only for the HTTP module</text>
  <text x="922" y="409" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">thread-safe snapshot reads</text>

  <!-- ChatServer -->
  <rect x="440" y="540" width="320" height="120" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="465" y="574" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#374151">ChatServer</text>
  <text x="465" y="599" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4b5563">Member 1 — TCP :5000</text>
  <text x="465" y="621" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">not on this branch yet</text>
  <text x="465" y="642" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">will call addMessage(...)</text>

  <!-- Other modules -->
  <rect x="900" y="70" width="240" height="120" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="918" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#374151">Other modules</text>
  <text x="918" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4b5563">TLS Auth :5443</text>
  <text x="918" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4b5563">UDP Status :5001</text>
  <text x="918" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4b5563">Multicast :5002</text>
  <text x="918" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#6b7280">not part of this module</text>

  <!-- Console -> HistoryServer -->
  <line x1="310" y1="315" x2="434" y2="315" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="320" y="303" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1d4ed8">HTTP GET /messages</text>

  <!-- curl -> HistoryServer -->
  <path d="M 310 480 H 400 V 380 H 434" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="318" y="468" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1d4ed8">GET /messages</text>

  <!-- HistoryServer -> MessageStore -->
  <line x1="760" y1="340" x2="894" y2="340" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="790" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#047857">toJsonArray()</text>

  <!-- ChatServer -> MessageStore -->
  <path d="M 760 600 H 1020 V 431" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowGray)"/>
  <text x="784" y="588" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">addMessage(...) — future</text>

  <!-- Footer note -->
  <text x="60" y="704" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#374151">Important: all servers are intended to run in one JVM started by Main, so HistoryServer and ChatServer share the same MessageStore singleton.</text>
  <text x="60" y="728" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Full URL: http://localhost:8080/messages   |   Wireshark filter: tcp.port == 8080 &amp;&amp; http</text>
</svg>
